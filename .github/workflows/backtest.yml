name: Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas numpy

      - name: Download data (Twelve Data)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        working-directory: backtest
        run: python fetch_td.py

      - name: Run backtest
        working-directory: backtest
        run: python run_bt.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/results
          git commit -m "backtest results" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
